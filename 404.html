<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Арена не найдена — GAMEpiada</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:#f5f7ff;
    background:
      radial-gradient(80% 60% at 50% 0%,rgba(243,205,124,.16),transparent 62%),
      radial-gradient(60% 50% at 80% 100%,rgba(177,139,255,.14),transparent 70%),
      #04060d;
  }
  .card{
    position:relative;width:min(620px,100%);padding:clamp(26px,5vw,52px);border-radius:28px;
    border:1px solid rgba(243,205,124,.28);
    background:linear-gradient(165deg,rgba(20,28,50,.82),rgba(8,12,24,.9));
    box-shadow:0 40px 100px -40px #000;text-align:center;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(243,205,124,.09),transparent 30%);animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .inner{position:relative}
  .code{font-size:clamp(4rem,16vw,7rem);line-height:.85;font-weight:800;letter-spacing:-.06em;color:transparent;
    background:linear-gradient(110deg,#fff3c9,#f3cd7c 40%,#b18bff 75%,#7fe9ff);
    -webkit-background-clip:text;background-clip:text}
  h1{font-size:clamp(1.3rem,3.4vw,1.9rem);margin:14px 0 8px;letter-spacing:-.03em}
  p{color:#8c9ab9;font-size:.92rem;line-height:1.6;margin:0 auto;max-width:40ch}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  a{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.25rem;border-radius:13px;
    font-weight:700;font-size:.88rem;text-decoration:none;color:#f5f7ff;border:1px solid rgba(154,175,225,.24);
    background:rgba(255,255,255,.05);transition:transform .2s,border-color .2s}
  a:hover{transform:translateY(-2px);border-color:rgba(243,205,124,.5)}
  a.primary{background:linear-gradient(135deg,#fff3c9,#f3cd7c 42%,#e0a341);color:#2a1a04;border-color:transparent}
  .trophy{font-size:2.2rem;filter:drop-shadow(0 0 20px rgba(243,205,124,.5));margin-bottom:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="trophy" aria-hidden="true">🏆</div>
      <div class="code">404</div>
      <h1>Эта арена не найдена</h1>
      <p>Похоже, страницу перенесли или матч отменили. Возвращайся на главную — там 17 дисциплин, сетки и живой состав.</p>
      <div class="actions">
        <a class="primary" href="/TOURNAMENTS/">На главную</a>
        <a href="/TOURNAMENTS/#bracket">К сетке</a>
      </div>
    </div>
  </div>
</body>
</html>
